name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.0.1' }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Create Config.xcconfig from secret
        run: |
          mkdir -p Resources
          echo "${{ secrets.CONFIG_XCCONFIG_BASE64 }}" | base64 --decode > Resources/Config.xcconfig

      # Release loads GoogleService-Info-Prod.plist by name (NotitAppApp.configureFirebase)
      # and fatalErrors without it — fail here instead of shipping a build that crashes on launch.
      - name: Create GoogleService-Info-Prod.plist from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PROD_PLIST_BASE64 }}" | base64 --decode > NotitApp/GoogleService-Info-Prod.plist
          PROJECT_ID=$(/usr/libexec/PlistBuddy -c "Print :PROJECT_ID" NotitApp/GoogleService-Info-Prod.plist)
          if [ -z "$PROJECT_ID" ] || [[ "$PROJECT_ID" == *placeholder* ]]; then
            echo "::error::GOOGLE_SERVICE_INFO_PROD_PLIST_BASE64 falta o no es un plist Prod real (PROJECT_ID='$PROJECT_ID')."
            exit 1
          fi

      - name: Decode signing certificate
        run: echo "${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}" | base64 --decode > certificate.p12

      - name: Decode provisioning profile
        run: echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

      - name: Build and upload to TestFlight
        env:
          CI: true
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          CERTIFICATE_PATH: certificate.p12
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_PATH: profile.mobileprovision
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane beta
